name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io.
# Uses GitHub Actions OIDC: the workflow identity of this gohyperdev repo
# grants the io.github.gohyperdev/* namespace (interactive device-flow
# login cannot read organization roles, so org publishes happen here).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for mcp-publisher login
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
