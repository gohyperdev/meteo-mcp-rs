name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io.
# Uses GitHub Actions OIDC: the workflow identity of this gohyperdev repo
# grants the io.github.gohyperdev/* namespace (interactive device-flow
# login cannot read organization roles, so org publishes happen here).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for mcp-publisher login
  contents: read

env:
  MCP_PUBLISHER_VERSION: "1.8.9"
  # sha256 of mcp-publisher_linux_amd64.tar.gz from the upstream
  # registry_<version>_checksums.txt — update together with the version.
  MCP_PUBLISHER_SHA256: "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
